---

- name: install custom facts
  copy:
    src: fort-check-hyperion.fact
    dest: /etc/ansible/facts.d/fort-check-hyperion.fact
    mode: 0755
  register: custom_fact_installed

- name: reloads facts
  setup:
  when: custom_fact_installed.changed

- name: Ensures destination directory exists
  file:
    path: /usr/local/src/mvIMPACT
    state: directory
    owner: root
    group: root
    mode: 0755

- name: Install custom installation script
  copy:
    src: install_mvHYPERION.sh
    dest: /usr/local/src/mvIMPACT/install_mvHYPERION.sh
    mode: 0755

- name: Install updated sources for driver
  copy:
    src: mvHYPERION-x86_64_ABI2-2.47.3.tgz
    dest: /usr/local/src/mvIMPACT/mvHYPERION-x86_64_ABI2-2.47.3.tgz
    mode: 0755

- name: Installs hyperion userland required packages
  apt:
    name:
      - libexpat1-dev
      - build-essential
      - libwxgtk-webview3.2-dev
      - libwxgtk3.2-dev
      - wx3.2-headers
      - libgtk2.0-dev
      - libfltk1.3-dev

- name: Runs installation
  shell: |
    cd /usr/local/src/mvIMPACT

    ./install_mvHYPERION.sh -u
  when: ansible_local['fort-check-hyperion']['hyperion-libraries'] == False

- name: Installs required packages
  apt:
    name: dkms

- name: Downloads mvHyperion kernel custom sources
  git:
    repo: https://github.com/formicidae-tracker/mvHyperion
    dest: /usr/src/mvHyperion-2.44.0
    version: main
  register: checked_out

- name: Adds module to dkms
  command: dkms add -m mvHyperion -v 2.44.0
  args:
    creates: /var/lib/dkms/mvHyperion/2.44.0/source

- name: Builds kernel module
  command: dkms build -m mvHyperion -v 2.44.0
  when: checked_out.changed or ansible_local['fort-check-hyperion']['hyperion-kernel'] == False

- name: Installs kernel module
  command: dkms install -m mvHyperion -v 2.44.0
  when: checked_out.changed or ansible_local['fort-check-hyperion']['hyperion-kernel'] == False

- name: disable IOMMU
  lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT="((?:(?!intel_iommu=off).)*?)"$'
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="\1 intel_iommu=off"'
    backup: true
    backrefs: true
  notify: update-grub
